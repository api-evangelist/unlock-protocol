entities:
  - name: Lock
    description: A membership smart contract deployed on a network; identified by (network, lockAddress). Locksmith stores its off-chain metadata and settings.
  - name: Key
    description: A membership NFT minted by a lock; identified by (network, lockAddress, keyId). Carries KeyMetadata and doubles as an event ticket.
  - name: User
    description: A wallet address (or Unlock Account for email users); carries UserMetadata scoped to a lock.
  - name: Application
    description: A developer application registered with Locksmith; holds the api-key credential.
  - name: Verifier
    description: An address authorized to check in tickets for a lock or event.
  - name: Event
    description: An event (slug-identified) whose tickets are keys of one or more locks; supports RSVPs and refunds.
  - name: EventCollection
    description: A curated collection of events with managers and approval workflow (EventCollectionAssociation links events to collections).
  - name: CheckoutConfig
    description: A saved checkout/paywall configuration (id-identified) owned by a lock manager.
  - name: Receipt
    description: Purchase receipt tied to (network, lockAddress, transaction hash); supplemented by a lock-level ReceiptsBase template.
  - name: Rsvp
    description: An attendee RSVP on an event, with approval status.
