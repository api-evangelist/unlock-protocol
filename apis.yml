aid: unlock-protocol
name: Unlock Protocol
description: Unlock Protocol is an open-source, community-governed protocol for onchain memberships
  and subscriptions. Creators deploy "locks" (membership smart contracts) that mint time-based,
  optionally recurring membership NFTs ("keys") across Ethereum, Base, Optimism, Polygon, Arbitrum,
  and other networks. The hosted Locksmith REST API adds off-chain conveniences — metadata storage,
  event ticketing with QR verification, checkout configuration, receipts, fiat payments via Stripe
  Connect, WebSub webhooks, and email delivery — while GraphQL subgraphs index the contracts per
  network. Originally built by Unlock Labs, stewardship passed to the Unlock Protocol Foundation
  and the Unlock DAO in 2025.
url: https://raw.githubusercontent.com/api-evangelist/unlock-protocol/refs/heads/main/apis.yml
